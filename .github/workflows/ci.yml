name: CI

on:
  push:
    branches: [main]
  pull_request:

# Los tests de integración necesitan una base; sin HK_INTEGRATION se saltan.
env:
  HK_INTEGRATION: "1"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemingway-kayak-web
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: hemingway
          POSTGRES_PASSWORD: hemingway
          POSTGRES_DB: hemingway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hemingway -d hemingway_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DB_SERVER: 127.0.0.1
      DB_PORT: "5432"
      DB_USER: hemingway
      DB_PASSWORD: hemingway
      DB_NAME: hemingway_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: hemingway-kayak-web/go.sum

      - name: Build
        run: go build ./cmd/... ./internal/... ./pkg/...

      - name: Vet
        run: go vet ./cmd/... ./internal/... ./pkg/...

      - name: Tests
        run: go test ./cmd/... ./internal/... ./pkg/... -count=1

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hemingway-kayak-web/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hemingway-kayak-web/web/package-lock.json

      - name: Build
        run: npm ci

      - name: Type/build check
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test
