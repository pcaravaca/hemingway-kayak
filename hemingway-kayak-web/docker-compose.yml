# Hemingway Kayak API — despliegue en el servidor Ubuntu (100.89.167.67)
#
# El backend habla con PostgreSQL, que corre en el mismo host dentro del
# contenedor `fcfeed-pgdev` (publicado en 5499). Dentro de este contenedor el
# host se resuelve como host.docker.internal (ver extra_hosts + .env).
#
# Desplegar:
#   cd /home/peter/hemingway-kayak
#   docker compose build --no-cache
#   docker compose up -d --force-recreate
#   docker compose ps
#   curl -s http://localhost:8080/api/v1/health
#
# Las credenciales viven en .env (chmod 600, gitignored). NO commitear.
services:
  api:
    build: .
    image: hemingway-kayak-api:local
    container_name: hk-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    ports:
      - "0.0.0.0:8080:8080"

  # SPA Vue 3 (nginx) — sirve web/dist y proxya /api y /ws hacia el contenedor api.
  # La SPA se construye con VITE_API_BASE=/ y el WS se deriva de window.location,
  # así que entra por el mismo origin y no necesita CORS.
  web:
    image: nginx:1.27-alpine
    container_name: hk-web
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "0.0.0.0:18085:80"
